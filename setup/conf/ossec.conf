<ossec_config>
  <client>
    <server>
      <address>172.25.0.30</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>ubuntu, ubuntu22, ubuntu22.04</config-profile>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- Wazuh logcollector: tail the real auth.log inside the container. -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <!-- Syscheck (FIM) left at defaults for now; tunables go here later. -->
</ossec_config>
